name: Build APK

run-name: Build APK v${{ inputs.version_name }} (#${{ github.run_number }})

# Hanya manual: muncul tombol "Run workflow" di tab Actions
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi aplikasi (contoh: 1.0)"
        required: true
        default: "1.0"
        type: string
      make_release:
        description: "Buat Release agar APK bisa diunduh langsung dari HP"
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # untuk membuat Release berisi APK

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PappVersion="$VERSION_NAME" \
            -PappCode="${{ github.run_number }}"

      - name: Ganti nama APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "GitPusher-v${VERSION_NAME}.apk"

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GitPusher-apk
          path: GitPusher-v*.apk

      - name: Buat Release
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gh release create "v${VERSION_NAME}-build${{ github.run_number }}" "GitPusher-v${VERSION_NAME}.apk" \
            --title "Git Pusher v${VERSION_NAME} (build ${{ github.run_number }})" \
            --notes "APK dibuat otomatis dari commit ${GITHUB_SHA::7}"
