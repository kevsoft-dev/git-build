name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependensi
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Pilih versi JDK sesuai Capacitor
        id: jdk
        run: |
          test -d node_modules/@capacitor/android || { echo "::error::@capacitor/android belum ada di package.json (dependencies)."; exit 1; }
          major=$(node -p "require('./node_modules/@capacitor/android/package.json').version.split('.')[0]")
          if [ "$major" -ge 7 ]; then echo "version=21" >> "$GITHUB_OUTPUT"; else echo "version=17" >> "$GITHUB_OUTPUT"; fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Siapkan folder web (www)
        run: |
          rm -rf www && mkdir www
          cp index.html app.js style.css www/
          cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.min.js#' www/index.html
          grep -q 'src="jszip.min.js"' www/index.html || { echo "::error::Gagal mengganti sumber JSZip di index.html."; exit 1; }
          test -f www/index.html

      - name: Tambah platform Android bila belum ada
        run: test -d android || npx cap add android

      - name: Pasang layanan latar belakang (foreground service)
        run: |
          pkg_dir=android/app/src/main/java/com/kevsoft/gittools
          test -d "$pkg_dir" || { echo "::error::Folder $pkg_dir tidak ada. Pastikan appId di capacitor.config.json adalah com.kevsoft.gittools."; exit 1; }
          cp native/BgService.java native/BgServicePlugin.java native/MainActivity.java "$pkg_dir/"
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Sinkronkan aset web ke Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx3g assembleDebug

      - name: Daftar APK hasil build
        run: find android -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rilis otomatis ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "kev-git-${tag}.apk"
          test -s "kev-git-${tag}.apk" || { echo "::error::File APK kosong atau tidak ada."; exit 1; }
          gh release create "$tag" "kev-git-${tag}.apk" \
            --target "${{ github.sha }}" \
            --title "kev-git ${tag}" \
            --notes "Build otomatis #${{ github.run_number }} dari commit ${GITHUB_SHA::7}. Unduh file .apk lalu instal."
          echo "Rilis dibuat: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${tag}"
